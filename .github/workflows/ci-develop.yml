# ─────────────────────────────────────────────────────────────────────────────
# RAMA develop  ·  INTEGRACIÓN del trabajo de todo el equipo
#   calidad · smoke -> [unitarios | datos | integración] -> cobertura >= 90 %
# Se lanza al hacer push a develop y en los pull request hacia develop.
# ─────────────────────────────────────────────────────────────────────────────
name: "2 · Develop: integración y cobertura"

on:
  push:
    branches: [develop]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [develop]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad de código (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar-entorno
      - run: uv run ruff check . --output-format=github

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar-entorno
      - run: uv run pytest -m smoke

  tests:
    name: ${{ matrix.tipo.nombre }}
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # aunque falle un tipo, se ejecutan los demás
      matrix:
        tipo:
          - { id: unitarios, nombre: "Unitarios", marcador: "unit" }
          - { id: datos, nombre: "Datos: esquema, valores, relaciones y contratos", marcador: "esquema or valores or relaciones or contratos" }
          - { id: integracion, nombre: "Integración", marcador: "integracion" }
          - { id: modelo, nombre: "Modelo", marcador: "modelo" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar-entorno
      - name: pytest -m "${{ matrix.tipo.marcador }}"
        run: uv run pytest -m "${{ matrix.tipo.marcador }}" --junitxml=informes/${{ matrix.tipo.id }}.xml
      - name: Guardar el informe JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.tipo.id }}
          path: informes/${{ matrix.tipo.id }}.xml

  cobertura:
    name: Cobertura (mínimo 90 %)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar-entorno
      - name: Tests con medición de cobertura
        run: >
          uv run pytest -m "smoke or unit or esquema or valores or relaciones or contratos or integracion or modelo"
          --cov --cov-report=term --cov-report=html:informes/cobertura --cov-fail-under=90
      - name: Resumen de cobertura en la página del workflow
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar el informe HTML de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-html
          path: informes/cobertura/
